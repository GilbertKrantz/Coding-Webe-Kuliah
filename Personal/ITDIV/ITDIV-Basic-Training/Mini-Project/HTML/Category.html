<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../CSS/style.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script defer src="https://kit.fontawesome.com/df5d4ed108.js" crossorigin="anonymous"></script>
    <script defer src="../JS/mobile-menu.js"></script>
    <script defer src="../JS/show-user.js"></script>
    <script defer src="../JS/category.js"></script>
</head>
<body>
    <header>
        <h1 class="brand">WearHouse</h1>
        <nav class="nav">
            <ul class="left links">
                <li><a href="Category.html" class="link">Category</a></li>
                <li><a href="about-us.html" class="link">About Us</a></li>
            </ul>
            <ul class="right links">
                <li><p id="user"></p></li>
                <li><a class="link" id="login">Login</a></li>
                <li><a href="Register.html" class="link" id="register">Register</a></li>
            </ul>
        </nav>
        <div class="btn-container"><i class="fa-solid fa-bars menu-btn"></i></div>
    </header>
    <div class="container categories-container">
        <h1>Product Categories</h1>
        <button class="btn btn-success" id="add-categories-btn">Add Categories</button>
        <table >
            <tr>
                <th>No.</th>
                <th>Category Name</th>
                <th>Category Action</th>
            </tr>
            <tbody id="categories"></tbody>
        </table>
    </div>
    <footer>
        <div class="icon-container">
            <i class="fa-brands fa-twitter brand-icon"><a href=""></a></i>
            <i class="fa-brands fa-facebook brand-icon"><a href=""></a></i>
            <i class="fa-brands fa-instagram brand-icon"><a href=""></a></i>
        </div>
        <div class="copyright">
            <p>Copyright &copy; 2021 Wilbert Chandra. All Right Reserved</p>
        </div>
    </footer>
    <div class="popup" id="add-categories-popup">
        <div class="popup-content">

            <div class="popup-header">
                <h1>Add Categories</h1>
                <button class="close-btn" id="close-categories-popup">X</button>
            </div>
            <hr/>
            <div class="popup-body">
                <form action="" class="categories-form" id="add-categories-form">
                    <div class="input-container popup-input">
                        <label for="category-name">Category Name</label>
                        <input type="text" name="category-name" id="category-name" placeholder="Category Name" class="input-field">
                    </div>
                    <hr/>
                    <div class="input-container popup-input self-align-end">
                        <input type="submit" value="Submit" class="btn self-align-end">
                    </div>
                </form>
            </div>
        </div>
    </div>
    <div class="popup" id="edit-categories-popup">
        <div class="popup-content">

            <div class="popup-header">
                <h1>Edit Categories</h1>
                <button class="close-btn" id="close-categories-popup">X</button>
            </div>
            <hr/>
            <div class="popup-body">
                <form action="" class="categories-form" id="edit-categories-form">
                    <div class="input-container popup-input">
                        <label for="category-name">Category Name</label>
                        <input type="text" name="category-name" id="edit-category-name" placeholder="Category Name" class="input-field">
                    </div>
                    <hr/>
                    <div class="input-container popup-input self-align-end">
                        <input type="submit" value="Submit" class="btn self-align-end">
                    </div>
                </form>
            </div>
        </div>
    </div>
    <div class="popup" id="delete-categories-popup">
        <div class="popup-content">

            <div class="popup-header">
                <h1>delete Categories</h1>
                <button class="close-btn" id="close-categories-popup">X</button>
            </div>
            <hr/>
            <div class="popup-body">
                <form action="" class="categories-form" id="delete-categories-form">
                    <div class="input-container popup-input">
                        <p>This action is irreversible are you sure you want to delete this category?</p>
                    </div>
                    <hr/>
                    <div class="input-container popup-input self-align-end">
                        <input type="submit" value="Submit" class="btn self-align-end">
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
