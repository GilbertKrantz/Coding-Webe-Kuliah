<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../CSS/style.css">
    <script src="https://kit.fontawesome.com/df5d4ed108.js" crossorigin="anonymous"></script>
    <script defer src="../JS/mobile-menu.js"></script>
    <script defer src="../JS/show-user.js"></script>
    <script defer src="../JS/register.js"></script>
</head>
<body>
    <header>
        <h1 class="brand">WearHouse</h1>
        <nav class="nav">
            <ul class="left links">
                <li><a href="Category.html" class="link">Category</a></li>
                <li><a href="about-us.html" class="link">About Us</a></li>
            </ul>
            <ul class="right links">
                <li><p id="user"></p></li>
                <li><a class="link" id="login">Login</a></li>
                <li><a href="Register.html" class="link" id="register">Register</a></li>
            </ul>
        </nav>
        <div class="btn-container"><i class="fa-solid fa-bars menu-btn"></i></div>
    </header>

    <div class="register-container container">
        <div class="title-container"><h1 class="register-title title">Register</h1></div>
        <div class="register-box box">
            <form method="post" id="register-form">
                <div class="input-container">
                    <label for="Name">Name</label>
                    <input type="text" name="Name" id="Name" placeholder="Name" class="input-field">
                </div>
                <div class="input-container">
                    <label for="Email">Email Address</label>
                    <input type="text" name="Email" id="Email" placeholder="Email" class="input-field">
                </div>
                <div class="input-container">
                    <label for="password">Password</label>
                    <input type="password" name="password" id="password" placeholder="Password" class="input-field">
                </div>
                <div class="input-container">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" name="confirm-password" id="confirm-password" placeholder="confirm-password" class="input-field">
                </div>
                <div class="input-container checkbox-container">
                    <input type="checkbox" name="TnC" id="TnC" class="checkbox">
                    <label for="TnC">Terms and Condition</label>
                </div>
                <div class="input-container submit">
                    <input type="submit" value="Register" class="btn">
                    <a href="">Forgot Your Password?</a>
                </div>
            </form>
        </div>
    </div>

    <footer>
        <div class="icon-container">
            <i class="fa-brands fa-twitter brand-icon"><a href=""></a></i>
            <i class="fa-brands fa-facebook brand-icon"><a href=""></a></i>
            <i class="fa-brands fa-instagram brand-icon"><a href=""></a></i>
        </div>
        <div class="copyright">
            <p>Copyright &copy; 2021 Wilbert Chandra. All Right Reserved</p>
        </div>
    </footer>
    
</body>
</html>
